<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Category — NovaStock</title>
<meta name="description" content="Browse products in this NovaStock category.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="utility-bar">
  <div class="container">
    <span class="utility-bar__msg">Welcome to NovaStock — new arrivals added weekly.</span>
    <div class="utility-bar__links">
      <a href="track-order.html">Track order</a>
      <a href="contact.html">Support</a>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo__mark">Nova<span>Stock</span></span>
      <span class="logo__tag">Digital Marketplace</span>
    </a>
    <nav class="main-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="category.html" class="is-active">Categories</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="track-order.html" class="icon-btn" aria-label="Track order">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </a>
      <a href="shop.html" class="btn btn--primary btn--sm">Browse Shop</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-nav">
    <div class="container">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="category.html">Categories</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <nav class="breadcrumb"><a href="index.html">Home</a><span class="breadcrumb__sep">/</span><a href="category.html">Categories</a><span class="breadcrumb__sep">/</span><span class="breadcrumb__current" id="crumb-cat">Category</span></nav>
    <h1 id="cat-title">Category</h1>
    <p id="cat-desc">Loading category…</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="toolbar">
      <span class="toolbar__count"><span id="result-count">0</span> products in this category</span>
    </div>
    <div class="product-grid" id="cat-products-grid"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug') || CATEGORIES[0].slug;
  var cat = getCategoryBySlug(slug) || CATEGORIES[0];
  var products = getProductsByCategory(cat.slug);

  document.getElementById('page-title').textContent = cat.name + ' — NovaStock';
  document.getElementById('cat-title').textContent = cat.name;
  document.getElementById('cat-desc').textContent = cat.desc;
  document.getElementById('crumb-cat').textContent = cat.name;
  document.getElementById('result-count').textContent = products.length;

  renderProductGrid('cat-products-grid', products.length ? products : PRODUCTS.slice(0, 4));
  renderFooter('site-footer');
</script>
</body>
</html>
